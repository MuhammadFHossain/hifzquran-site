<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The share card, laid out like the 4.0 store banner: paper in the banner's
     painted border, the words on the left, the Al-Fatihah opening on the shamsa
     on the right. Render it at 1200x630, served over http:
     python3 -m http.server 8765, then
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars
       --window-size=1200,630 --screenshot=/tmp/og.png "http://localhost:8765/og-render.html"
     and save /tmp/og.png as assets/img/og.jpg at quality 88.
     The phone is a real 4.0 screen (assets/shots/fatihah), so a reshoot of that
     screen means rendering this again. -->
<style>
  @font-face { font-family:"Fraunces"; src:url("assets/fonts/Fraunces-VF.woff") format("woff"); font-weight:100 900; }
  @font-face { font-family:"Fraunces"; src:url("assets/fonts/Fraunces-Italic-VF.woff") format("woff"); font-weight:100 900; font-style:italic; }
  * { margin:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; overflow:hidden; }
  /* The app's day ground: bright cream paper lit from the top, the rosettes pressed in. */
  body { position:relative; color:#22271F; font-family:"Fraunces",Georgia,serif;
         background:linear-gradient(180deg,#FFFAEE,#FDF5E3 45%,#F8ECD3); }
  .pattern { position:absolute; inset:0; background:url("assets/art/ground-day.svg") 0 0 / 88px 88px; }
  .frame { position:absolute; inset:14px; border:44px solid transparent;
           border-image:url("assets/art/frame.webp") 113 round; }
  .in { position:absolute; left:104px; top:96px; width:560px; }
  .wm { display:flex; align-items:center; gap:14px; }
  .wm .m { width:58px; height:58px; background:url("assets/img/mark.png") center / contain no-repeat; }
  .wm .t { font-size:32px; font-weight:540; letter-spacing:-.01em; }
  .wm .t i { font-style:italic; font-weight:500; color:#86621F; }
  h1 { margin-top:44px; font-size:88px; line-height:1.02; font-weight:540; letter-spacing:-.025em; }
  h1 em { font-style:italic; font-weight:520; color:#86621F; }
  .rule { display:block; width:240px; margin:26px 0 22px; }
  p { font-family:-apple-system,system-ui,sans-serif; font-size:25px; color:#4A4F43; max-width:26ch; line-height:1.4; }
  .shamsa { position:absolute; width:560px; left:620px; top:35px; }
  .phone { position:absolute; width:220px; left:790px; top:76px; border-radius:31px / 31px;
           border:1px solid rgba(28,25,22,.5); box-shadow:0 18px 40px rgba(60,48,20,.22), 0 2px 6px rgba(0,0,0,.06); }
</style>
</head>
<body>
  <div class="pattern"></div>
  <img class="shamsa" src="assets/art/shamsa.webp" alt="">
  <img class="phone" src="assets/shots/fatihah.webp" alt="">
  <div class="frame"></div>
  <div class="in">
    <div class="wm"><span class="m"></span><span class="t">Quran <i>Pages</i></span></div>
    <h1>Read, repeat, <em>pray.</em></h1>
    <img class="rule" src="assets/art/rule.webp" alt="">
    <p>Painted like an illuminated Quran. Any ayah on repeat, and prayer times for your city.</p>
  </div>
</body>
</html>
